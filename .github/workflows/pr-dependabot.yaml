name: code generation and module fix for PR from dependabot

# This action runs on other PRs opened by dependabot. It updates modules and generated code on PRs opened by dependabot.
on:
  pull_request:
    branches:
      - dependabot/**
  push:
    branches:
      - dependabot/**
  workflow_dispatch:

permissions:
  contents: write # Allow to update the PR.

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v2
    - name: Calculate go version
      id: vars
      run: echo "go_version=$(make go-version)" >> $GITHUB_OUTPUT
    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.23'
    # - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # tag=v4.2.3
    #   name: Restore go cache
    #   with:
    #     path: |
    #       ~/.cache/go-build
    #       ~/go/pkg/mod
    #     key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
    #     restore-keys: |
    #       ${{ runner.os }}-go-
    - name: Update go modules for proto
      working-directory: './proto'
      run: go mod tidy
    - name: Update go modules for experimental
      working-directory: './experimental'
      run: go mod tidy
    - name: Update go modules for kubectl plugin
      working-directory: './kubectl-plugin'
      run: go mod tidy
    - name: Update go modules for apiserver
      working-directory: './apiserver'
      run: go mod tidy
    - name: Update go modules for ray operator
      working-directory: './ray-operator'
      run: go mod tidy
    - name: Update generated code
      working-directory: './ray-operator'
      run: ./hack/update-codegen.sh
    - uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # tag=v9.1.4
      name: Commit changes
      with:
        author_name: dependabot[bot]
        author_email: 49699333+dependabot[bot]@users.noreply.github.com
        default_author: github_actor
        message: 'Update generated code'